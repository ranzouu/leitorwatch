name: LeitorWatch
options:
  bundleIdPrefix: com.rayson.leitorwatch
targets:
  LeitorWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources
    entitlements:
      path: Sources/LeitorWatch.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.rayson.leitorwatch
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.rayson.leitorwatch
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.rayson.leitorwatch
        com.apple.developer.icloud-services:
          - CloudDocuments
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
